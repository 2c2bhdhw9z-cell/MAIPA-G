name: MAIPA-G Autonomous runner

on:
  workflow_call:
    inputs:
      job_id:
        description: Private MAIPA-G job id
        required: true
        type: string
      target_ref:
        description: Target branch to check out
        required: true
        type: string
      data_owner:
        description: Owner of the private MAIPA-G-data repo
        required: true
        type: string
      data_repo:
        description: Private data repository name
        required: true
        type: string
      data_branch:
        description: Private data repository branch
        required: true
        type: string
    secrets:
      MAIPAG_APP_ID:
        required: true
      MAIPAG_APP_PRIVATE_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: true
      MAIPAG_MCP_SECRETS:
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Make a target-repo bot token
        id: target-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MAIPAG_APP_ID }}
          private-key: ${{ secrets.MAIPAG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Make a private-data bot token
        id: data-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MAIPAG_APP_ID }}
          private-key: ${{ secrets.MAIPAG_APP_PRIVATE_KEY }}
          owner: ${{ inputs.data_owner }}
          repositories: ${{ inputs.data_repo }}

      - name: Check out the target repo
        uses: actions/checkout@v5
        with:
          token: ${{ steps.target-token.outputs.token }}
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared runner
        uses: actions/checkout@v5
        with:
          repository: 2c2bhdhw9z-cell/MAIPA-G
          ref: main
          path: .maipag-runner
          persist-credentials: false

      - name: Keep runner files outside target changes
        shell: bash
        run: printf '/.maipag-runner/\n' >> .git/info/exclude

      - name: Run the private job
        shell: bash
        env:
          MAIPAG_JOB_ID: ${{ inputs.job_id }}
          MAIPAG_TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          MAIPAG_DATA_TOKEN: ${{ steps.data-token.outputs.token }}
          MAIPAG_DATA_OWNER: ${{ inputs.data_owner }}
          MAIPAG_DATA_REPO: ${{ inputs.data_repo }}
          MAIPAG_DATA_BRANCH: ${{ inputs.data_branch }}
          MAIPAG_MCP_SECRETS: ${{ secrets.MAIPAG_MCP_SECRETS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          target_file="$RUNNER_TEMP/maipag-target-token"
          data_file="$RUNNER_TEMP/maipag-data-token"
          openrouter_file="$RUNNER_TEMP/maipag-openrouter-key"
          mcp_file="$RUNNER_TEMP/maipag-mcp-secrets"
          printf '%s' "$MAIPAG_TARGET_TOKEN" > "$target_file"
          printf '%s' "$MAIPAG_DATA_TOKEN" > "$data_file"
          printf '%s' "$OPENROUTER_API_KEY" > "$openrouter_file"
          printf '%s' "$MAIPAG_MCP_SECRETS" > "$mcp_file"
          unset MAIPAG_TARGET_TOKEN MAIPAG_DATA_TOKEN OPENROUTER_API_KEY MAIPAG_MCP_SECRETS GH_TOKEN GITHUB_TOKEN
          export MAIPAG_TARGET_TOKEN_FILE="$target_file"
          export MAIPAG_DATA_TOKEN_FILE="$data_file"
          export OPENROUTER_API_KEY_FILE="$openrouter_file"
          export MAIPAG_MCP_SECRETS_FILE="$mcp_file"
          exec swift run --package-path .maipag-runner/AgentCore -c release MAIPAGRunner

      - name: Check for a dedicated preview artifact
        id: preview
        if: always()
        shell: bash
        run: |
          if test -f .maipag-preview-artifact/index.html; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the commit-matched preview artifact
        if: always() && steps.preview.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site-${{ inputs.job_id }}
          path: .maipag-preview-artifact
          if-no-files-found: error
          retention-days: 7
