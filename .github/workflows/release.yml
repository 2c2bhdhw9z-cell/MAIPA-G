name: Release

# Publishes the .ipa for a commit on main once that exact commit has a green iOS run, however the
# commit got there: a pull request merge, a direct push, or a manual run. Nothing is rebuilt:
# scripts/publish-verified-ipa.sh re-checks the run (both gating jobs green, the IPA embeds this
# commit) and attaches that run's checked artifact. A commit whose iOS tests or build didn't pass
# is never published, and a commit that already has a published build is not published twice.
on:
  # Every iOS run that finishes. Only a successful run of a commit that is on main publishes; a
  # pull request's own check (its head is not on main) just skips, and its merge commit on main
  # is checked and published on its own.
  workflow_run:
    workflows: [iOS]
    types: [completed]
  # By hand: publish a main commit (default: the newest). With no green iOS run for it yet, this
  # starts one (or waits for the one already running) and publishes when it passes.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to publish (empty = newest main commit)
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the checked .ipa
    # A failed or cancelled iOS run shows here as skipped, never as a red Release.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find the commit's green iOS check
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          MAIN_HEAD=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$EVENT" = "workflow_run" ]; then SHA="$RUN_SHA"; else SHA="${INPUT_SHA:-$MAIN_HEAD}"; fi
          SHA=$(gh api "repos/$REPO/commits/$SHA" --jq .sha)
          # Only commits on main are published. A pull request's head is checked by its own run;
          # the commit the merge makes on main gets its own run and is published from that.
          ON_MAIN=$(gh api "repos/$REPO/compare/$SHA...$MAIN_HEAD" --jq .status)
          case "$ON_MAIN" in identical|ahead) ;; *) skip "$SHA is not on main (compare: $ON_MAIN), so there is nothing to publish";; esac
          # [skip ci] commits get no iOS run on purpose, so there is nothing checked to publish.
          # GitHub honours the marker anywhere in the message, the body included.
          MESSAGE=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.message)
          if printf '%s' "$MESSAGE" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            skip "$SHA is a [skip ci] commit, so it is not built or published"
          fi
          # One published build per commit: a re-run or a second green run of it changes nothing.
          EXISTING=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.draft == false and (.tag_name | test(\"^build-[0-9]+-${SHA:0:7}\$\")) and any(.assets[]; .name == \"MAIPA-G.ipa\")) | .tag_name][0] // empty")
          if [ -n "$EXISTING" ]; then skip "$SHA is already published as $EXISTING"; fi

          # The newest completed iOS run of this exact commit, from any event, whose complete
          # build matrix passed.
          green_run() {
            for id in $(gh api "repos/$REPO/actions/workflows/ios.yml/runs?head_sha=$SHA&per_page=20" --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .id'); do
              ok=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=20" --jq '[.jobs[] | select((.name=="AgentCore tests (Linux)" or .name=="iPhone release candidate") and .status=="completed" and .conclusion=="success")] | length')
              if [ "$ok" = "2" ]; then echo "$id"; return; fi
            done
          }
          unfinished_runs() {
            gh api "repos/$REPO/actions/workflows/ios.yml/runs?head_sha=$SHA&per_page=20" --jq '[.workflow_runs[] | select(.status!="completed")] | length'
          }
          RUN_ID=$(green_run)
          if [ -z "$RUN_ID" ] && [ "$EVENT" = "workflow_dispatch" ]; then
            # No green run yet: wait for one that is running, or start one. ios.yml can only be
            # started on a branch, so only main's newest commit can be checked this way.
            if [ "$(unfinished_runs)" = "0" ]; then
              [ "$SHA" = "$MAIN_HEAD" ] || { echo "::error::$SHA has no green iOS run, and only main's newest commit ($MAIN_HEAD) can be checked now"; exit 1; }
              echo "No iOS run of $SHA yet; starting one on main."
              gh api -X POST "repos/$REPO/actions/workflows/ios.yml/dispatches" -f ref=main
              sleep 20
            fi
            for attempt in $(seq 1 85); do
              RUN_ID=$(green_run)
              [ -n "$RUN_ID" ] && break
              # A run that was just started can take a moment to be listed.
              if [ "$attempt" -gt 3 ] && [ "$(unfinished_runs)" = "0" ]; then break; fi
              sleep 60
            done
          fi
          if [ -z "$RUN_ID" ]; then echo "::error::no iOS run of $SHA passed both its tests and its build, so it is not published"; exit 1; fi
          echo "Publishing $SHA from iOS run $RUN_ID."
          echo "main=$SHA" >> "$GITHUB_OUTPUT"
          echo "head=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ "$SHA" = "$(gh api "repos/$REPO/commits/main" --jq .sha)" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIPAG_LATEST: ${{ steps.source.outputs.latest }}
        run: |
          chmod +x scripts/publish-verified-ipa.sh
          scripts/publish-verified-ipa.sh "${{ steps.source.outputs.run }}" "${{ steps.source.outputs.head }}" "${{ steps.source.outputs.main }}"
      - name: Say how to install it
        if: steps.source.outputs.skip != 'true'
        run: |
          {
            echo "## Install this build"
            echo
            echo "**[Download MAIPA-G.ipa](https://github.com/${{ github.repository }}/releases/latest/download/MAIPA-G.ipa)** (always the newest build)."
            echo
            echo "Then sign it with your sideloading app."
          } >> "$GITHUB_STEP_SUMMARY"
