name: iOS

# The complete release candidate is built once, on the ready pull request. A squash merge does not
# rebuild it: release.yml runs scripts/publish-verified-ipa.sh, which proves the PR and main trees
# match before publishing this run's checked artifact. It only publishes when every job here passed.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "App/**"
      - "AgentCore/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: AgentCore tests (Linux)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool versions
        run: swift --version
      - name: Cache SwiftPM builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: AgentCore/.build
          key: agentcore-linux-${{ hashFiles('AgentCore/Package.resolved') }}-${{ hashFiles('AgentCore/Sources/**', 'AgentCore/Tests/**') }}
          restore-keys: agentcore-linux-${{ hashFiles('AgentCore/Package.resolved') }}-
      - name: Build Autonomous runner
        run: swift build --package-path AgentCore -c release --product MAIPAGRunner
      - name: Tests
        run: swift test --package-path AgentCore
      - name: Public network checks
        env:
          MAIPAG_NETWORK_TESTS: "1"
        run: swift test --package-path AgentCore --filter NetworkTests
      - name: Check immutable CI dependencies and release gates
        run: python3 scripts/check-ci-policy.py
      - name: Compile independent IPA checker
        run: python3 -m py_compile scripts/check-ipa.py scripts/check-ci-policy.py

  # Starts at once, alongside the Linux checks, so a Mac-only compile error shows up early.
  screens:
    name: Complete Dark and Light screenshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install reviewed XcodeGen 2.46.0
        run: |
          curl --proto '=https' --tlsv1.2 -fL 'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip' -o "$RUNNER_TEMP/xcodegen.zip"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - name: Take every screenshot
        env:
          MAIPAG_REQUIRE_COMPLETE: "1"
        run: |
          chmod +x scripts/screenshots.sh
          scripts/screenshots.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MAIPA-G-screenshots-${{ github.run_number }}
          path: |
            App/build/screenshots/*.png
            App/build/screenshots/*.txt
          if-no-files-found: error
          retention-days: 14

  ipa:
    name: iPhone release candidate
    needs: [checks, screens]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Runner and toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | sed -n '/iOS/,/^$/p' || true
      - name: Install reviewed XcodeGen 2.46.0
        run: |
          curl --proto '=https' --tlsv1.2 -fL 'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip' -o "$RUNNER_TEMP/xcodegen.zip"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      # Run under a pseudo-terminal so each test's progress shows in the log as it happens, and
      # stop after 15 minutes: the whole suite takes seconds, so anything longer is a stuck test.
      - name: AgentCore tests (macOS)
        timeout-minutes: 15
        run: script -q /dev/null swift test --package-path AgentCore
      - name: Build and package the IPA
        env:
          MAIPAG_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x App/package-ipa.sh scripts/check-ipa.py
          App/package-ipa.sh
      - name: Independently check the IPA
        run: python3 scripts/check-ipa.py App/build/MAIPA-G.ipa --build "${{ github.run_number }}" --version "0.1.0"
      - name: Upload checked release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MAIPA-G-ipa-${{ github.run_number }}
          path: |
            App/build/MAIPA-G.ipa
            App/build/DerivedData/Build/Products/Release-iphoneos/MAIPA-G.app.dSYM
          if-no-files-found: error
          retention-days: 14
