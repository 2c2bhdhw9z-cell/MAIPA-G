name: iOS

# Builds and checks the complete release candidate for pull requests, for every push to main and
# by hand. When a run of a main commit passes, release.yml (on workflow_run) publishes this run's
# checked artifact through scripts/publish-verified-ipa.sh. It only publishes when every job here passed.
# A pull request merge is not built twice: when the main commit has exactly the tree of a merged
# pull request head whose run already passed, the push run reuses that run (release.yml publishes
# its artifact after proving the trees match) instead of building the same code again.
on:
  workflow_dispatch:
  # Every commit on main, so the newest one always has a checked build to release.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "App/**"
      - "AgentCore/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"

# A newer push to a pull request replaces its older run. On main nothing is cancelled midway: a
# run in progress finishes and the newest waiting commit runs next, so the newest always gets built.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On a push to main: is this exact tree already checked by a merged pull request's green run?
  reuse:
    name: Find an identical checked tree
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: Look for a merged pull request head with the same tree and a green run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            [ "$head" != "$SHA" ] || continue
            [ "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)" = "$TREE" ] || continue
            for id in $(gh api "repos/$REPO/actions/workflows/ios.yml/runs?head_sha=$head&per_page=20" --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .id'); do
              ok=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=20" --jq '[.jobs[] | select((.name=="AgentCore tests (Linux)" or .name=="iPhone release candidate") and .status=="completed" and .conclusion=="success")] | length')
              artifacts=$(gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.expired == false and ((.name|startswith("MAIPA-G-ipa-")) or (.name|startswith("MAIPAGRunner-linux-"))))] | length')
              if [ "$ok" = "2" ] && [ "$artifacts" -ge 2 ]; then
                echo "::notice::$SHA has the same tree as pull request head $head, already checked by run $id; not building it again."
                echo "run=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "No identical checked tree; building $SHA."

  checks:
    name: AgentCore tests (Linux)
    needs: reuse
    # Runs unless the push reused an identical checked tree (reuse is skipped for other events).
    if: "!cancelled() && needs.reuse.outputs.run == '' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The exact PR head, not GitHub's temporary merge commit: the IPA embeds this revision
          # and Autonomous callers download runner-<revision>, which release.yml publishes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tool versions
        run: swift --version
      - name: Cache SwiftPM builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: AgentCore/.build
          key: agentcore-linux-${{ hashFiles('AgentCore/Package.resolved') }}-${{ hashFiles('AgentCore/Sources/**', 'AgentCore/Tests/**') }}
          restore-keys: agentcore-linux-${{ hashFiles('AgentCore/Package.resolved') }}-
      - name: Build Autonomous runner
        run: swift build --package-path AgentCore -c release --product MAIPAGRunner
      - name: Package checksummed Autonomous runner
        run: |
          set -euo pipefail
          mkdir -p build/runner
          cp AgentCore/.build/release/MAIPAGRunner build/runner/MAIPAGRunner
          tar -C build/runner -czf build/MAIPAGRunner-linux-x86_64.tar.gz MAIPAGRunner
          (cd build && sha256sum MAIPAGRunner-linux-x86_64.tar.gz > MAIPAGRunner-linux-x86_64.tar.gz.sha256)
      - name: Upload checked Autonomous runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MAIPAGRunner-linux-${{ github.run_number }}
          path: |
            build/MAIPAGRunner-linux-x86_64.tar.gz
            build/MAIPAGRunner-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Tests
        run: swift test --package-path AgentCore
      - name: Public network checks
        env:
          MAIPAG_NETWORK_TESTS: "1"
        run: swift test --package-path AgentCore --filter NetworkTests
      - name: Check immutable CI dependencies and release gates
        run: python3 scripts/check-ci-policy.py
      - name: 29 October UI regression checks
        run: python3 scripts/check-regressions.py
      - name: Compile independent IPA checker
        run: python3 -m py_compile scripts/check-ipa.py scripts/check-ci-policy.py

  # Runs alongside the Linux checks; release.yml publishes only when both passed.
  ipa:
    name: iPhone release candidate
    needs: reuse
    if: "!cancelled() && needs.reuse.outputs.run == ''"
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The exact PR head, not GitHub's temporary merge commit: the IPA embeds this revision
          # and Autonomous callers download runner-<revision>, which release.yml publishes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Runner and toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | sed -n '/iOS/,/^$/p' || true
      - name: Install reviewed XcodeGen 2.46.0
        run: |
          curl --proto '=https' --tlsv1.2 -fL 'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip' -o "$RUNNER_TEMP/xcodegen.zip"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      # Run under a pseudo-terminal so each test's progress shows in the log as it happens, and
      # stop after 15 minutes: the whole suite takes seconds, so anything longer is a stuck test.
      - name: AgentCore tests (macOS)
        timeout-minutes: 15
        run: script -q /dev/null swift test --package-path AgentCore
      - name: Build and package the IPA
        env:
          MAIPAG_BUILD_NUMBER: ${{ github.run_number }}
          MAIPAG_REVIEWED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          chmod +x App/package-ipa.sh scripts/check-ipa.py
          App/package-ipa.sh
      - name: Independently check the IPA
        run: python3 scripts/check-ipa.py App/build/MAIPA-G.ipa --build "${{ github.run_number }}" --version "0.1.0" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload checked release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MAIPA-G-ipa-${{ github.run_number }}
          path: |
            App/build/MAIPA-G.ipa
            App/build/DerivedData/Build/Products/Release-iphoneos/MAIPA-G.app.dSYM
          if-no-files-found: error
          retention-days: 14
