# XcodeGen input. `xcodegen generate` turns this into MAIPA-G.xcodeproj, which is not committed:
# a .xcodeproj is a UUID-keyed file nobody can review or edit without a Mac, while this YAML is
# readable. package-ipa.sh generates the project, builds it and packages the .ipa.
#
# Paths are relative to this file (App/).

name: MAIPA-G
options:
  bundleIdPrefix: dev.maipag
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
  # Nothing is signed by Xcode. package-ipa.sh signs the bundle ad hoc, and the owner's sideloading
  # app signs it again with his certificate on the phone.

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "0.1.0"
    # The build number. package-ipa.sh passes the CI run number here, so every build is newer
    # than the last and sideloading apps replace the installed copy.
    CURRENT_PROJECT_VERSION: "1"
    # Exact reviewed source revision embedded into generated Autonomous callers.
    MAIPAG_REVIEWED_REVISION: ""
    DEAD_CODE_STRIPPING: YES
    SWIFT_COMPILATION_MODE: wholemodule
    SWIFT_OPTIMIZATION_LEVEL: -O
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  AgentCore:
    path: ../AgentCore

targets:
  MAIPA-G:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      # XcodeGen writes this file from the keys below on every generate.
      properties:
        CFBundleDisplayName: MAIPA-G
        CFBundleName: MAIPA-G
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MAIPAGReviewedRevision: "$(MAIPAG_REVIEWED_REVISION)"
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # The address GitHub and OpenRouter send sign-ins back to, through the Pages site.
        CFBundleURLTypes:
          - CFBundleURLName: dev.maipag.app
            CFBundleURLSchemes:
              - maipag
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.maipag.app.refresh
          - dev.maipag.app.autonomous
        NSCameraUsageDescription: Take a photo to attach to your MAIPA-G chat.
        NSPhotoLibraryAddUsageDescription: Save pictures you generate in MAIPA-G to your Photos library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maipag.app
        PRODUCT_NAME: MAIPA-G
        PRODUCT_MODULE_NAME: MAIPAG
        # iPhone only. Set on the target because XcodeGen's own target default is iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Without this the icon catalogue compiles but no icon is assigned, and the app installs
        # as a blank square. The name must match the .appiconset folder.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_PREVIEWS: NO
    dependencies:
      - package: AgentCore
        product: AgentCore
      - package: AgentCore
        product: ChatMarkdown

# Declared so the scheme is shared: `xcodebuild -scheme` cannot see the private schemes Xcode would
# otherwise make the first time someone opens the project, and on CI nobody ever does.
schemes:
  MAIPA-G:
    build:
      targets:
        MAIPA-G: all
    run:
      config: Release
    archive:
      config: Release
